services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: test-agent-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
