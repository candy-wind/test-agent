spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

platform:
  bootstrap:
    enabled: false
  secret-key: test-only-secret-key-for-unit-tests
  allow-dev-secret: true
  outbound:
    allow-private-hosts: true

auth:
  username: admin
  password: test-password

boxoffice:
  refresh-initial-delay-ms: 3600000
  refresh-interval-ms: 3600000
