server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: test-agent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/test_agent}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true   # 静态页面每次使用前都向服务端校验，避免旧页面被浏览器缓存导致跳转异常
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    log-request-details: false  # 不打印请求参数明细，避免登录表单/口令落入日志
  http:
    log-request-details: false

logging:
  level:
    root: INFO
    vip.mate.agent: INFO
    org.springframework.web: INFO
  file:
    # 日志目录/服务名可通过环境变量覆盖；Windows 上 /mnt/logs 会落到当前盘符根目录
    name: ${LOG_DIR:/mnt/logs}/${LOG_SERVICE_NAME:test-agent}/app.log
  logback:
    rollingpolicy:
      max-history: 15          # 保留 15 天
      max-file-size: 50MB      # 单个日志文件上限
      total-size-cap: 5GB      # 日志总大小上限
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# 模型供应商、模型与 API Key 统一在「模型配置」页面维护（写入数据库并通过 APP_SECRET_KEY 加密），
# 这里不再保留任何模型 Key。
agent:
  search:
    enabled: true
    max-results: 5

upload:
  dir: ./uploads

# 票房数据源
#  apizero: 公开源(极数本源 movie-box,数据来源猫眼专业版)
#          匿名试用额度用尽后必须配置 API Key(https://apizero.cn 注册获取)
#  maoyan : 猫眼专业版官方接口(需 signKey/mygsig 签名,可能被风控拦截,可配置登录 Cookie)
boxoffice:
  provider: apizero
  refresh-interval-ms: 60000   # 定时刷新数据源缓存间隔(毫秒),默认 60 秒
  apizero:
    api-key: ${APIZERO_API_KEY:}   # 兜底配置；推荐在「模型配置 > 外部数据源」页面保存（加密存库，优先生效）
  maoyan:
    cookie: ""   # 可选:浏览器登录猫眼专业版后复制的完整 Cookie

auth:
  # 口令只从环境变量读取：AUTH_PASSWORD_HASH（BCrypt，推荐）或 AUTH_PASSWORD（明文）。
  # 两者都未设置时，启动会生成一次性随机口令并打印在日志中，且不再有默认弱口令。
  username: ${AUTH_USERNAME:admin}
  password: ${AUTH_PASSWORD:}
  password-hash: ${AUTH_PASSWORD_HASH:}
  token-ttl-hours: ${AUTH_TOKEN_TTL_HOURS:24}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:5}
  lockout-minutes: ${AUTH_LOCKOUT_MINUTES:15}

# 平台基础配置（P0）
platform:
  bootstrap:
    enabled: true          # 首次启动自动初始化管理员/默认空间（模型配置请在页面添加）
  # 用于加密数据库中的模型 API Key。生产必须通过 APP_SECRET_KEY 设置；
  # 未设置时启动直接失败，本地开发可显式设置 PLATFORM_ALLOW_DEV_SECRET=true 降级。
  secret-key: ${APP_SECRET_KEY:}
  allow-dev-secret: ${PLATFORM_ALLOW_DEV_SECRET:false}
  # 出站地址防护：默认拒绝 baseUrl 指向内网/元数据地址，防止 SSRF。
  # 本地 Ollama/vLLM 需设 OUTBOUND_ALLOW_PRIVATE_HOSTS=true，或只放行指定域名。
  outbound:
    allowed-hosts: ${OUTBOUND_ALLOWED_HOSTS:}
    allow-private-hosts: ${OUTBOUND_ALLOW_PRIVATE_HOSTS:false}
  knowledge:
    # 是否启用向量化。false 时上传只做解析/切分，检索使用关键词匹配，不依赖 embedding 模型
    vectorization-enabled: ${KB_VECTORIZATION_ENABLED:false}
    # 与 kb_embedding.embedding 的 vector(1024) 保持一致；换模型维度时需要修改迁移脚本
    embedding-dimension: 1024
    embedding-batch-size: 16
    # 上传原文件的本地存储目录（相对项目根目录）
    storage-dir: ${KB_STORAGE_DIR:./data/kb}
    # 单次检索默认返回条数
    default-top-k: 5
    max-top-k: 20
    # 拼进提示词的检索内容上限（字符数），避免超出上下文
    max-context-chars: 8000
    # RAG 问答最多携带的历史消息条数
    max-history-messages: 12